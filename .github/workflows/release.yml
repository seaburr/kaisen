name: release
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r service/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: service

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/kaisen-runtime:${{ github.sha }}
      - uses: docker/build-push-action@v7
        with:
          context: service
          push: true
          build-args: |
            RUNTIME_IMAGE=ghcr.io/${{ github.repository_owner }}/kaisen-runtime:${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/kaisen:${{ github.sha }}
