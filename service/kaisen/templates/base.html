<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Kaisen{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header><strong>Kaisen</strong>
{% if logged_in %}<a href="/">Projects</a><a href="/inbox">Inbox</a><a href="/spend">Spend</a><a href="/settings">Settings</a>
<form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button>Log out</button></form>{% endif %}
</header>
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% block body %}{% endblock %}
</main></body></html>
