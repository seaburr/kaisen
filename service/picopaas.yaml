apiVersion: picopaas/v1
name: kaisen
image: ghcr.io/seaburr/kaisen:<sha>   # full commit sha from the release workflow
port: 8080
healthCheck: { enabled: true, path: /healthz }
resources: { db: true, db_engine: mysql }
env:
  ENVIRONMENT: prod
  DATABASE_URL: ${{ db.url }}
  DATABASE_CA_CERT: ${{ db.ca_cert }}
secrets:
  - SECRET_KEY
# Optional: KAISEN_RUNTIME_IMAGE overrides the runtime image baked into the Kaisen image (ghcr.io/<owner>/kaisen-runtime:<sha>).
# Previews also need Settings > PicoPaaS (API key) and a public https URL for this app.
