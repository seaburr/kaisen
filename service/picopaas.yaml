apiVersion: picopaas/v1
name: kaisen
image: ghcr.io/seaburr/kaisen:<sha>   # full commit sha from the release workflow
port: 8080
healthCheck: { enabled: true, path: /healthz }
resources: { db: true, db_engine: mysql }
env:
  ENVIRONMENT: prod
  DATABASE_URL: ${{ db.url }}
  DATABASE_CA_CERT: ${{ db.ca_cert }}
secrets:
  - SECRET_KEY
